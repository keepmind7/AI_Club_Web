# 프로젝트 이름. 없으면 폴더 이름을 쓰는데, 한글만 있는 폴더 이름이면 비어서 실행되지 않는다.
name: club

services:
  django:
    build: ./backend
    env_file: .env
    environment:
      DEBUG: "0"
      DB_PATH: /app/data/db.sqlite3
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    build: ./frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - django
    restart: unless-stopped

volumes:
  caddy_data:
